# Render blueprint for the API.
#
#   New → Blueprint → point at this repo. Render reads this file, then asks
#   for the values marked sync:false below.
#
# Render has no managed MySQL, so DB_* must point at a MySQL 8 you host
# elsewhere (Railway, Aiven, TiDB Serverless, your own server). If you would
# rather keep the API and the database in one place, skip this file and deploy
# the Dockerfile to Railway instead — see README § Deploying.

services:
  - type: web
    name: orderko-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT; config.js reads it.

      # Must list the exact origin serving the frontend, scheme included and
      # no trailing slash. Comma-separate to allow more than one.
      - key: CORS_ORIGIN
        value: https://rsmatic.github.io

      # Public URL of this service. The mock Grab provider builds its tracking
      # links from it.
      - key: PUBLIC_BASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: overnight_oats

      # Leave as mock until you have GrabExpress partner credentials.
      - key: GRAB_MODE
        value: mock
      - key: GRAB_CLIENT_ID
        sync: false
      - key: GRAB_CLIENT_SECRET
        sync: false
      - key: GRAB_WEBHOOK_SECRET
        sync: false
