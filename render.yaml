# Render blueprint for the API.
#
#   New → Blueprint → point at this repo. Render reads this file, then asks
#   for the values marked sync:false below.
#
# There is no database service: the store is a JSON file on the disk mounted
# below. That disk is what makes the deployment durable — without it every
# order is lost on the next deploy.
#
# NOTE: Render's free instance type does not support disks, and its filesystem
# is ephemeral. Use a paid instance type, or deploy the compose stack on your
# own server instead (see DEPLOY.md).

services:
  - type: web
    name: orderko-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health

    # A JSON file store has no cross-process locking, so exactly one instance.
    numInstances: 1

    disk:
      name: orderko-data
      mountPath: /app/apps/api/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT; config.js reads it.

      - key: DATA_FILE
        value: data/store.json

      # The exact origin serving the frontend, scheme included, no trailing
      # slash. Comma-separate to allow more than one.
      - key: CORS_ORIGIN
        value: https://rsmatic.github.io

      # This service's own public URL; simulated tracking links use it.
      - key: PUBLIC_BASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      # Must not be the documented default — the API refuses to boot with it
      # in production. Write down what you set: it is the seeded admin login.
      - key: SEED_PASSWORD
        sync: false

      # Leave as sim until you have GrabExpress partner credentials.
      - key: GRAB_MODE
        value: sim
      - key: GRAB_AUTO_ADVANCE_SECONDS
        value: 25
      - key: GRAB_CLIENT_ID
        sync: false
      - key: GRAB_CLIENT_SECRET
        sync: false
      - key: GRAB_WEBHOOK_SECRET
        sync: false
