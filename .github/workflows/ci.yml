name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and smoke-test
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-only-secret
      SEED_PASSWORD: Password123!
      GRAB_MODE: sim
      # No timer: the smoke test drives the simulated driver itself, and an
      # auto-advance running alongside would race its assertions.
      GRAB_AUTO_ADVANCE_SECONDS: 0
      PORT: 4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the web app
        run: npm run build --workspace apps/web

      # The browser demo and the API run the same @overnight-oats/core. This
      # exercises it through the demo's adapters.
      - name: Test the core through the demo adapters
        run: npm run test:demo

      - name: Start the API
        run: |
          npm run start --workspace apps/api &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not come up in time"
          exit 1

      # Same suite, through HTTP against the JSON store.
      - name: Smoke test
        run: npm run smoke

      - name: Data survives a restart
        run: |
          BEFORE=$(curl -s http://localhost:4000/api/health | node -pe "JSON.parse(require('fs').readFileSync(0)).orders")
          pkill -f "apps/api/src/index.js" || pkill -f "src/index.js" || true
          sleep 2
          npm run start --workspace apps/api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health > /dev/null && break
            sleep 1
          done
          AFTER=$(curl -s http://localhost:4000/api/health | node -pe "JSON.parse(require('fs').readFileSync(0)).orders")
          echo "orders before=$BEFORE after=$AFTER"
          test "$BEFORE" = "$AFTER"

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t orderko-api .

      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t orderko-web .

      - name: Validate the compose stack
        env:
          JWT_SECRET: ci
          SEED_PASSWORD: ci-not-the-default
        run: docker compose config --quiet && echo "compose file is valid"
