name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Note the build mode
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::notice title=Demo build::No VITE_API_BASE_URL set, so the site ships with the in-browser demo backend. Set that repository variable (Settings → Secrets and variables → Actions → Variables) to point at a real deployed API instead."
          else
            echo "::notice title=Live build::Calling the API at ${{ vars.VITE_API_BASE_URL }}"
          fi

      - name: Build
        env:
          # Project sites are served from /<repo>/, so the bundle needs that prefix.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Pages cannot run the API, so fall back to the in-browser backend
          # rather than publishing a site that cannot do anything. A real API
          # address always wins — see DEMO in apps/web/src/lib/api.js.
          VITE_DEMO: ${{ vars.VITE_API_BASE_URL == '' && '1' || '0' }}
        run: npm run build --workspace apps/web

      - name: Add SPA fallback
        # Pages has no history fallback: a deep link like /manager/orders is a
        # missing file. Serving the same document as 404.html lets the router
        # take over, with the requested URL still in the address bar.
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
