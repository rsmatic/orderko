# The whole stack on one machine: the API and the web app behind Caddy.
# There is no database service — the store is a JSON file on the api-data
# volume.
#
#   cp .env.compose.example .env
#   # edit .env — at minimum JWT_SECRET and SEED_PASSWORD
#   docker compose up -d --build
#
# The store seeds itself on first boot. Open http://localhost (or SITE_ADDRESS).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # One process only. A JSON file store has no locking across processes, so
    # a second replica would silently overwrite this one's writes.
    deploy:
      replicas: 1
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_FILE: data/store.json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD in .env}
      # Caddy puts the app and the API on one origin, so this is only a
      # fallback for reaching the API directly.
      CORS_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      GRAB_MODE: ${GRAB_MODE:-sim}
      GRAB_AUTO_ADVANCE_SECONDS: ${GRAB_AUTO_ADVANCE_SECONDS:-25}
      GRAB_CLIENT_ID: ${GRAB_CLIENT_ID:-}
      GRAB_CLIENT_SECRET: ${GRAB_CLIENT_SECRET:-}
      GRAB_WEBHOOK_SECRET: ${GRAB_WEBHOOK_SECRET:-}
    volumes:
      - api-data:/app/apps/api/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Your domain for automatic HTTPS, e.g. shop.example.com.
      # Unset or blank serves plain HTTP on HTTP_PORT.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  api-data:
  caddy-data:
  caddy-config:
